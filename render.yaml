# Price Radar — моніторинг цін конкурентів

Сайт із формою: вставляєш посилання на сторінки товарів у різних магазинах →
отримуєш таблицю з цінами, знижками й наявністю → завантажуєш CSV для Excel.

## Як це працює

- **Фронтенд** (`templates/index.html`) — форма для лінків і таблиця результатів.
- **Бекенд** (`app.py`, Flask) — заходить на кожну сторінку і витягує дані трьома
  способами по черзі: structured data (JSON-LD schema.org) → мета-теги → типові
  селектори магазинів. Завдяки цьому більшість українських магазинів працює
  без додаткових налаштувань.

Перевірено на: rozetka.com.ua, dnipro-m.ua, bosch-online.kiev.ua, makita.market.

---

## Варіант 1. Запуск на своєму комп'ютері (5 хвилин)

1. Встанови Python з https://python.org (галочка **Add Python to PATH** під час встановлення).
2. Відкрий папку проєкту в терміналі (у Windows: правий клік у папці → «Відкрити в терміналі»).
3. Виконай:

   ```
   pip install -r requirements.txt
   python app.py
   ```

4. Відкрий у браузері: **http://localhost:5000**

Готово — сайт працює локально.

---

## Варіант 2. Викласти в інтернет безкоштовно (Render.com)

1. Створи акаунт на https://github.com і завантаж туди цю папку як новий
   репозиторій (кнопка **Add file → Upload files** — можна просто перетягнути файли).
2. Створи акаунт на https://render.com (можна увійти через GitHub).
3. Натисни **New → Web Service** → обери свій репозиторій.
4. Render сам підхопить налаштування з файлу `render.yaml`. Якщо питає вручну:
   - **Build Command:** `pip install -r requirements.txt`
   - **Start Command:** `gunicorn app:app`
   - **Plan:** Free
5. Натисни **Create Web Service** — за 2–3 хвилини отримаєш посилання виду
   `https://price-radar.onrender.com`.

⚠️ На безкоштовному тарифі Render сервіс «засинає» після 15 хвилин без
відвідувань — перше відкриття після паузи займає ~30–60 секунд. Для особистого
користування це нормально.

---

## Обмеження, про які варто знати

- **Rozetka та інші великі маркетплейси** іноді блокують запити з хмарних
  серверів (з локального комп'ютера зазвичай працює краще).
- Максимум **30 посилань за один запит** — щоб не перевантажувати магазини.
- Скрипт збирає лише відкриті публічні дані (ціна, назва, наявність) — те саме,
  що бачить будь-який відвідувач сторінки.

## Як додати «примхливий» магазин

Якщо якийсь сайт не віддає ціну — надішли його лінк, і в `app.py` у словник
`STORE_SELECTORS` можна додати селектори конкретно під нього.
